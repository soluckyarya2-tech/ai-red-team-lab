services:
  kali:
    image: kali-lab
    container_name: kali  
    command: sleep infinity
  webui:
    image: ghcr.io/open-webui/open-webui:0.3.16
    container_name: webui
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      OLLAMA_BASE_URL: http://host.orb.internal:11434
    volumes:
      - open-webui:/app/backend/data

volumes:
  open-webui:
